<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Underdog&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Distressed&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bunker</title>
  </head>
  <body>

  <style>
  .bunker-load-screen {
    background: #0a0a0a;
    color: #00ff41; /* "Матричный" или янтарный цвет */
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
  }

  /* Тот самый "радарный" спиннер */
  .radar {
    width: 80px;
    height: 80px;
    border: 2px solid #00ff41;
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
  }
  .radar::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 50%; height: 2px;
    background: #00ff41;
    transform-origin: left;
    animation: scan 2s linear infinite;
  }

  @keyframes scan {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

    <div id="root">
      <div class="bunker-load-screen">
        <div class="radar"></div>
        <p>System Initializing...</p>
        <div id="terminal-logs" style="font-size: 10px; opacity: 0.7;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
